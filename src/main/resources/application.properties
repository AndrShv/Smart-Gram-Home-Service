# --- Database ---
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.main.allow-bean-definition-overriding=true
spring.r2dbc.enabled=false
spring.jpa.properties.hibernate.format_sql=false

# --- MinIO ---
minio.bucket-stories=${MINIO_BUCKET_STORIES}
minio.bucket-posts=${MINIO_BUCKET_POSTS}
minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_AVATARS_BUCKET}

# --- Server ---
server.port=${SERVER_PORT:8083}

java.awt.headless=true

# --- Service URLs ---
AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
PROFILE_SERVICE_URL=${PROFILE_SERVICE_URL}
SUBSCRIPTION_SERVICE_URL=${SUBSCRIPTION_SERVICE_URL}
NOTIFICATION_SERVICE_URL=${NOTIFICATION_SERVICE_URL}
POST_SERVICE_URL=${POST_SERVICE_URL}
STORY_SERVICE_URL=${STORY_SERVICE_URL}
# --- Imagga API ---
imagga.api.key=${IMAGGA_API_KEY}
imagga.api.secret=${IMAGGA_API_SECRET}

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS}

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBIT_HOST}
spring.rabbitmq.port=${RABBIT_PORT}
spring.rabbitmq.username=${RABBIT_USERNAME}
spring.rabbitmq.password=${RABBIT_PASSWORD}
auth.queue.name=${AUTH_QUEUE_NAME}

# Logging settings
logging.file.name=logs/app.log
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.com.example.project=DEBUG
logging.level.com.example.project.service.custom=DEBUG
logging.level.com.example.project.service.custom.CustomOAuth2UserService=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Security settings
spring.security.enabled=true
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION_MS}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION_MS}

# Thymeleaf settings
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# SMTP settings
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.messages.fallback-to-system-locale=false
spring.messages.encoding=UTF-8
management.health.mail.enabled=false

# Gemini API
gemini.api.key=${GEMINI_API_KEY}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}
spring.security.oauth2.client.registration.google.client-name=Google