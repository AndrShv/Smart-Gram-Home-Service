<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки - SmartGram</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .settings-container { padding: 80px 20px 100px; max-width: 600px; margin: 0 auto; }
        .setting-section { background: rgba(15,20,35,0.8); border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(0,212,255,0.2); }
        .setting-title { color: #00d4ff; font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .setting-item:last-child { border-bottom: none; }
        .setting-label { color: white; font-size: 14px; }
        .setting-description { color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 5px; }
        .toggle { width: 50px; height: 26px; background: rgba(255,255,255,0.2); border-radius: 13px; position: relative; cursor: pointer; transition: all 0.3s ease; }
        .toggle.active { background: linear-gradient(135deg, #00d4ff, #7b2ff7); }
        .toggle-slider { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: all 0.3s ease; }
        .toggle.active .toggle-slider { left: 27px; }
        .btn-logout { background: linear-gradient(135deg, #ff4757, #ff6348); border: none; padding: 12px 30px; border-radius: 10px; color: white; font-weight: 600; cursor: pointer; width: 100%; margin-top: 20px; transition: all 0.3s ease; }
        .btn-logout:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,71,87,0.4); }
    </style>
</head>
<body>
<div class="space-background">
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>
</div>
<header class="top-bar">
    <div class="top-bar-content">
        <div class="logo"><i class="fas fa-rocket"></i><span>SmartGram</span></div>
    </div>
</header>
<main class="main-content">
    <div class="settings-container">
        <div class="setting-section">
            <div class="setting-title"><i class="fas fa-bell"></i> Уведомления</div>
            <div class="setting-item">
                <div>
                    <div class="setting-label">Новые подписчики</div>
                    <div class="setting-description">Уведомления о новых подписчиках</div>
                </div>
                <div class="toggle active">
                    <div class="toggle-slider"></div>
                </div>
            </div>
            <div class="setting-item">
                <div>
                    <div class="setting-label">Лайки и комментарии</div>
                    <div class="setting-description">Уведомления о взаимодействиях</div>
                </div>
                <div class="toggle active">
                    <div class="toggle-slider"></div>
                </div>
            </div>
        </div>
        <div class="setting-section">
            <div class="setting-title"><i class="fas fa-lock"></i> Приватность</div>
            <div class="setting-item">
                <div>
                    <div class="setting-label">Приватный аккаунт</div>
                    <div class="setting-description">Только подписчики видят посты</div>
                </div>
                <div class="toggle" id="privacyToggle"><div class="toggle-slider"></div></div>
            </div>
        </div>
        <div class="setting-section">
            <div class="setting-title"><i class="fas fa-palette"></i> Внешний вид</div>
            <div class="setting-item">
                <div>
                    <div class="setting-label">Тёмная тема</div>
                    <div class="setting-description">Космический дизайн активен</div>
                </div>
                <div class="toggle active">
                    <div class="toggle-slider"></div>
                </div>
            </div>
        </div>
        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Выйти</button>
    </div>
</main>
<nav class="bottom-nav">
    <a href="/home" class="nav-item"><i class="fas fa-home"></i><span>Главная</span></a>
    <a href="/search" class="nav-item"><i class="fas fa-search"></i><span>Поиск</span></a>
    <a href="/messages" class="nav-item"><i class="fas fa-comment-dots"></i><span>Сообщения</span></a>
    <a href="/profile" class="nav-item"><i class="fas fa-user"></i><span>Профиль</span></a>
    <a href="/settings" class="nav-item active"><i class="fas fa-cog"></i><span>Настройки</span></a>
</nav>
<script>
    const privacyToggle = document.getElementById('privacyToggle');

 async function loadPrivacyState() {
     try {
         const response = await fetch('/api/posts/privacy/status', {
             credentials: 'include'
         });
         if (!response.ok) return;
         const data = await response.json();
         const label = privacyToggle.closest('.setting-item').querySelector('.setting-description');
         if (data.isPrivate) {
             privacyToggle.classList.add('active');
             label.textContent = 'Только подписчики видят посты';
         } else {
             privacyToggle.classList.remove('active');
             label.textContent = 'Все пользователи видят посты';
         }
     } catch(e) {
         console.error('Ошибка загрузки состояния приватности:', e);
     }
 }

 loadPrivacyState();

privacyToggle.addEventListener('click', async () => {
    const currentlyPrivate = privacyToggle.classList.contains('active');
    const willBePrivate = !currentlyPrivate;
    const isPublic = !willBePrivate;

    try {
        const [r1, r2] = await Promise.all([
            fetch(`/api/posts/privacy/all?isPublic=${isPublic}`, {
                method: 'PUT', credentials: 'include'
            }),
            fetch(`/api/stories/privacy/all?isPublic=${isPublic}`, {
                method: 'PUT', credentials: 'include'
            })
        ]);

        if (!r1.ok || !r2.ok) throw new Error('Ошибка сервера');

        if (willBePrivate) {
            privacyToggle.classList.add('active');
        } else {
            privacyToggle.classList.remove('active');
        }

        const label = privacyToggle.closest('.setting-item').querySelector('.setting-description');
        label.textContent = willBePrivate
            ? 'Только подписчики видят посты'
            : 'Все пользователи видят посты';

        console.log(`✅ willBePrivate=${willBePrivate}, isPublic=${isPublic}`);
    } catch(e) {
        console.error('Ошибка:', e);
        alert('Не удалось обновить настройки');
    }
});

 document.querySelectorAll('.toggle:not(#privacyToggle)').forEach(toggle => {
     toggle.addEventListener('click', () => toggle.classList.toggle('active'));
 });

 function logout() {
     document.cookie = 'jwt=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
     window.location.href = 'http://localhost:8081/auth/login';
 }
</script>
</body>
</html>
