<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartGram — Создать историю</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap');
    :root { --bg:#090a0f; --surface:rgba(15,20,35,0.85); --border:rgba(0,212,255,0.18); --cyan:#00d4ff; --violet:#7b2ff7; --text:#f0f4ff; --muted:rgba(240,244,255,0.45); }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    .space-bg{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,#0d1a2e 0%,#090a0f 70%);z-index:-2}
    .nebula{position:fixed;inset:0;z-index:-1;pointer-events:none}
    .nebula::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(123,47,247,0.12) 0%,transparent 70%);top:-100px;right:-100px;animation:drift 12s ease-in-out infinite alternate}
    .nebula::after{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(0,212,255,0.08) 0%,transparent 70%);bottom:-100px;left:-80px;animation:drift 16s ease-in-out infinite alternate-reverse}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,30px)}}
    .stars{position:fixed;inset:0;z-index:-1}
    .stars::before,.stars::after{content:'';position:absolute;inset:0;background-image:radial-gradient(1px 1px at 15% 25%,#fff,transparent),radial-gradient(1px 1px at 40% 60%,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 70% 10%,#fff,transparent),radial-gradient(2px 2px at 25% 70%,rgba(255,255,255,.4),transparent);background-size:400px 400px;animation:twinkle 6s ease-in-out infinite}
    .stars::after{background-size:600px 600px;animation-duration:9s;animation-direction:reverse;opacity:.5}
    @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.4}}
    .top-bar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(9,10,15,0.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
    .top-bar-inner{max-width:560px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
    .back-btn{width:40px;height:40px;border-radius:12px;background:rgba(0,212,255,0.08);border:1px solid var(--border);color:var(--cyan);display:flex;align-items:center;justify-content:center;text-decoration:none;transition:all .25s}
    .back-btn:hover{background:rgba(0,212,255,0.18);border-color:var(--cyan)}
    .page-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--cyan),var(--violet));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .page-wrap{max-width:560px;margin:0 auto;padding:90px 20px 40px}
    .upload-zone{position:relative;border:2px dashed rgba(0,212,255,0.3);border-radius:20px;background:rgba(0,212,255,0.03);height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:all .3s;overflow:hidden;margin-bottom:24px}
    .upload-zone:hover,.upload-zone.drag-over{border-color:var(--cyan);background:rgba(0,212,255,0.07)}
    .upload-zone input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
    .upload-icon{width:64px;height:64px;background:linear-gradient(135deg,rgba(0,212,255,0.15),rgba(123,47,247,0.15));border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--cyan);transition:transform .3s}
    .upload-zone:hover .upload-icon{transform:scale(1.1) rotate(-5deg)}
    .upload-hint{font-size:13px;color:var(--muted);text-align:center;line-height:1.5}
    .upload-hint strong{color:var(--cyan)}
    .upload-preview{position:absolute;inset:0;z-index:1}
    .upload-preview img{width:100%;height:100%;object-fit:cover}
    .upload-preview-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6) 0%,transparent 50%);display:flex;align-items:flex-end;padding:14px}
    .change-photo-badge{background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 14px;font-size:12px;color:#fff}
    .form-grid{display:flex;flex-direction:column;gap:16px}
    .field-group{display:flex;flex-direction:column;gap:6px}
    .field-label{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
    .field-label span{color:var(--cyan)}
    input[type="text"],textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .25s,box-shadow .25s;resize:none}
    input[type="text"]:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,0.08)}
    textarea{min-height:80px}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
    .toggle-label{font-size:14px}
    .toggle-label small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
    .toggle{position:relative;width:46px;height:26px}
    .toggle input{opacity:0;width:0;height:0}
    .toggle-track{position:absolute;inset:0;background:rgba(255,255,255,.12);border-radius:13px;cursor:pointer;transition:background .3s}
    .toggle input:checked + .toggle-track{background:linear-gradient(135deg,var(--cyan),var(--violet))}
    .toggle-track::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .3s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
    .toggle input:checked + .toggle-track::after{transform:translateX(20px)}
    .next-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--cyan),var(--violet));border:none;border-radius:14px;color:#fff;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;letter-spacing:.04em;cursor:pointer;margin-top:8px;transition:opacity .25s,transform .25s,box-shadow .25s;box-shadow:0 6px 24px rgba(0,212,255,0.25)}
    .next-btn:hover{opacity:.92;transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,212,255,0.35)}
    .next-btn:disabled{opacity:.4;transform:none;cursor:not-allowed}
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#ff4757;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:500;z-index:700;transition:transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
    .toast.show{transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
<div class="space-bg"></div><div class="nebula"></div><div class="stars"></div>

<header class="top-bar">
  <div class="top-bar-inner">
    <a href="/home" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <span class="page-title">Новая история</span>
  </div>
</header>

<div class="page-wrap">
  <div class="upload-zone" id="uploadZone">
    <input type="file" id="photoInput" accept="image/*">
    <div class="upload-icon"><i class="fas fa-image"></i></div>
    <div class="upload-hint"><strong>Выберите фото</strong> или перетащите<br>JPG, PNG, WEBP · до 10 МБ</div>
    <div class="upload-preview" id="uploadPreview" style="display:none">
      <img id="thumbImg" src="" alt="">
      <div class="upload-preview-overlay">
        <span class="change-photo-badge"><i class="fas fa-sync-alt"></i> Сменить фото</span>
      </div>
    </div>
  </div>

  <div class="form-grid">
    <div class="field-group">
      <label class="field-label" for="description">Описание</label>
      <textarea id="description" placeholder="Расскажи, что происходит..."></textarea>
    </div>
    <div class="field-group">
      <label class="field-label" for="location"><span><i class="fas fa-map-marker-alt"></i></span> Местоположение</label>
      <input type="text" id="location" placeholder="Одесса, Украина">
    </div>
    <div class="field-group">
      <label class="field-label" for="overlayText">Текст поверх фото</label>
      <input type="text" id="overlayText" placeholder="Крупный текст на истории...">
    </div>
    <div class="field-group">
      <label class="field-label" for="musicCaption"><span><i class="fas fa-music"></i></span> Музыка / подпись</label>
      <input type="text" id="musicCaption" placeholder="Название трека или исполнитель">
    </div>
    <div class="toggle-row">
      <div class="toggle-label">Публичная история<small>Видна всем пользователям</small></div>
      <label class="toggle"><input type="checkbox" id="isPublic" checked><span class="toggle-track"></span></label>
    </div>
    <button class="next-btn" id="nextBtn" disabled>
      <i class="fas fa-eye" style="margin-right:8px"></i>Далее — предпросмотр
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const photoInput = document.getElementById('photoInput');
  const uploadZone = document.getElementById('uploadZone');
  const uploadPreview = document.getElementById('uploadPreview');
  const thumbImg = document.getElementById('thumbImg');
  const nextBtn = document.getElementById('nextBtn');
  const toast = document.getElementById('toast');
  let selectedFile = null, objectUrl = null;

  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault(); uploadZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) handleFile(f);
  });
  photoInput.addEventListener('change', () => { if (photoInput.files[0]) handleFile(photoInput.files[0]); });

  function handleFile(file) {
    if (file.size > 10 * 1024 * 1024) { showToast('Файл слишком большой (макс. 10 МБ)'); return; }
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(file);
    selectedFile = file;
    thumbImg.src = objectUrl;
    uploadPreview.style.display = 'block';
    nextBtn.disabled = false;
  }

  nextBtn.addEventListener('click', () => {
    if (!selectedFile) return;
    nextBtn.disabled = true;
    nextBtn.textContent = 'Загрузка...';

    const reader = new FileReader();
    reader.onload = function(e) {
      // Очищаем старые данные
      ['story_photo_base64','story_photo_name','story_photo_type',
       'story_description','story_location','story_overlayText',
       'story_musicCaption','story_isPublic'].forEach(k => sessionStorage.removeItem(k));

      sessionStorage.setItem('story_photo_base64',  e.target.result);
      sessionStorage.setItem('story_photo_name',    selectedFile.name);
      sessionStorage.setItem('story_photo_type',    selectedFile.type);
      sessionStorage.setItem('story_description',   document.getElementById('description').value);
      sessionStorage.setItem('story_location',      document.getElementById('location').value);
      sessionStorage.setItem('story_overlayText',   document.getElementById('overlayText').value);
      sessionStorage.setItem('story_musicCaption',  document.getElementById('musicCaption').value);
      sessionStorage.setItem('story_isPublic',      document.getElementById('isPublic').checked);

      window.location.href = '/stories/preview';
    };
    reader.onerror = () => { showToast('Ошибка чтения файла'); nextBtn.disabled = false; nextBtn.innerHTML = '<i class="fas fa-eye" style="margin-right:8px"></i>Далее — предпросмотр'; };
    reader.readAsDataURL(selectedFile);
  });

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3500);
  }
</script>
</body>
</html>
