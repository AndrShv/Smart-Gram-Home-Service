<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сообщения - SmartGram</title>
  <link rel="stylesheet" th:href="@{/css/home.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .chat-list { padding: 80px 20px 100px; max-width: 600px; margin: 0 auto; }
    .chat-item { background: rgba(15,20,35,0.8); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(0,212,255,0.2); display: flex; gap: 15px; align-items: center; cursor: pointer; transition: all 0.3s ease; }
    .chat-item:hover { border-color: #00d4ff; transform: translateX(5px); }
    .chat-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(0,212,255,0.3); }
    .chat-info { flex: 1; }
    .chat-name { color: white; font-weight: 600; margin-bottom: 5px; }
    .chat-message { color: rgba(255,255,255,0.6); font-size: 14px; }
    .chat-time { color: rgba(255,255,255,0.4); font-size: 12px; }
    .empty-state { text-align: center; padding: 100px 20px; color: rgba(255,255,255,0.5); }
    .empty-state i { font-size: 80px; margin-bottom: 20px; opacity: 0.5; }
  </style>
</head>
<body>
<div class="space-background"><div class="stars"></div><div class="stars2"></div><div class="stars3"></div></div>
<header class="top-bar"><div class="top-bar-content"><div class="logo"><i class="fas fa-rocket"></i><span>SmartGram</span></div></div></header>
<main class="main-content">
  <div class="chat-list" id="chatList">
    <div class="empty-state">
      <i class="fas fa-comments"></i>
      <p>У вас пока нет сообщений</p>
    </div>
  </div>
</main>
<nav class="bottom-nav">
  <a href="/home" class="nav-item"><i class="fas fa-home"></i><span>Главная</span></a>
  <a href="/search" class="nav-item"><i class="fas fa-search"></i><span>Поиск</span></a>
  <a href="/messages" class="nav-item active"><i class="fas fa-comment-dots"></i><span>Сообщения</span></a>
  <a href="/profile" class="nav-item"><i class="fas fa-user"></i><span>Профиль</span></a>
  <a href="/settings" class="nav-item"><i class="fas fa-cog"></i><span>Настройки</span></a>
</nav>
</body>
</html>
