<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подписки — SmartGram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root{--bg:#07080f;--surface:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);--border-h:rgba(255,255,255,0.18);--text:#f0f2ff;--muted:rgba(240,242,255,0.45);--accent1:#a78bfa;--accent2:#38bdf8;--accent3:#fb7185;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;}
    .space-background{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse 80% 60% at 50% 0%,#130d2e 0%,#07080f 60%);}
    .stars,.stars2{position:absolute;inset:0;}
    .stars{background-image:radial-gradient(1px 1px at 15px 25px,rgba(255,255,255,.9),transparent),radial-gradient(1.5px 1.5px at 85px 60px,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 480px 20px,rgba(255,255,255,.9),transparent);background-size:550px 120px;animation:twinkle 6s ease-in-out infinite;}
    .stars2{background-image:radial-gradient(1px 1px at 30px 50px,rgba(167,139,250,.7),transparent),radial-gradient(1.5px 1.5px at 170px 80px,rgba(56,189,248,.6),transparent);background-size:520px 100px;animation:twinkle 9s ease-in-out infinite reverse;}
    @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.4}}
    .aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
    .aurora-blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.12;}
    .aurora-blob:nth-child(1){width:500px;height:350px;top:-80px;left:-120px;background:radial-gradient(circle,var(--accent1),transparent 70%);animation:drift1 18s ease-in-out infinite;}
    .aurora-blob:nth-child(2){width:400px;height:300px;bottom:0;right:-80px;background:radial-gradient(circle,var(--accent2),transparent 70%);animation:drift2 22s ease-in-out infinite;}
    @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
    @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,20px)}}

    .top-bar{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(7,8,15,.7);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
    .top-bar-content{max-width:680px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:14px;}
    .back-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:8px;transition:color .2s;border-radius:10px;}
    .back-btn:hover{color:var(--text);background:rgba(255,255,255,.06);}
    .page-title{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;}
    .tab-switcher{margin-left:auto;display:flex;gap:2px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:3px;}
    .tab-switch-btn{padding:5px 14px;border-radius:7px;border:none;background:none;color:var(--muted);cursor:pointer;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;transition:all .2s;}
    .tab-switch-btn.active{background:rgba(167,139,250,.2);color:var(--accent1);}

    .main-content{max-width:680px;margin:78px auto 0;padding:0 16px;}

    .user-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;animation:row-in .3s ease both;}
    @keyframes row-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .user-row:hover{border-color:var(--border-h);background:rgba(255,255,255,.06);}
    .user-avatar{width:50px;height:50px;border-radius:50%;object-fit:cover;border:1.5px solid var(--border-h);flex-shrink:0;}
    .user-info{flex:1;min-width:0;}
    .user-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;}
    .user-bio{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
    .btn-sub{padding:8px 16px;border-radius:10px;border:none;cursor:pointer;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;white-space:nowrap;transition:all .2s;flex-shrink:0;}
    .btn-sub.follow{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:white;}
    .btn-sub.follow:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(167,139,250,.4);}
    .btn-sub.unfollow{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--border);}
    .btn-sub.unfollow:hover{background:rgba(251,113,133,.12);color:var(--accent3);border-color:rgba(251,113,133,.3);}

    .empty{text-align:center;padding:80px 20px;color:var(--muted);}
    .empty i{font-size:48px;margin-bottom:16px;display:block;opacity:.3;}
    .empty p{font-size:15px;}

    .loader-dots{display:flex;gap:8px;justify-content:center;margin:60px 0 16px;}
    .loader-dot{width:8px;height:8px;border-radius:50%;background:var(--accent1);animation:dot-pulse 1.4s ease-in-out infinite;}
    .loader-dot:nth-child(2){animation-delay:.2s;background:var(--accent2);}
    .loader-dot:nth-child(3){animation-delay:.4s;background:var(--accent3);}
    @keyframes dot-pulse{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}

    .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(7,8,15,.85);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:8px 18px;border-radius:14px;transition:all .2s;font-family:'Syne',sans-serif;}
    .nav-item i{font-size:20px;}
    .nav-item.active{color:var(--accent1);background:rgba(167,139,250,.1);}
  </style>
</head>
<body>
<div class="space-background"><div class="stars"></div><div class="stars2"></div></div>
<div class="aurora"><div class="aurora-blob"></div><div class="aurora-blob"></div></div>

<header class="top-bar">
  <div class="top-bar-content">
    <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
    <span class="page-title">Подписки</span>
    <div class="tab-switcher">
      <button class="tab-switch-btn" id="toFollowers">Подписчики</button>
      <button class="tab-switch-btn active">Подписки</button>
    </div>
  </div>
</header>

<main class="main-content" id="listWrap">
  <div class="loader-dots"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>
</main>

<nav class="bottom-nav">
  <a href="/home"     class="nav-item"><i class="fas fa-house"></i><span>Главная</span></a>
  <a href="/search"   class="nav-item"><i class="fas fa-magnifying-glass"></i><span>Поиск</span></a>
  <a href="/messages" class="nav-item"><i class="fas fa-comment-dots"></i><span>Чаты</span></a>
  <a href="/profile"  class="nav-item active"><i class="fas fa-user"></i><span>Профиль</span></a>
  <a href="/settings" class="nav-item"><i class="fas fa-gear"></i><span>Настройки</span></a>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', async function() {
      const parts  = window.location.pathname.split('/');
      const userId = parts[parts.length - 2]; // /profile/{userId}/followings

      document.getElementById('toFollowers').onclick = () => {
          window.location.href = `/profile/${userId}/followers`;
      };

      let myUserId     = null;
      let myFollowings = new Set();

      try {
          const r = await fetch('/api/auth/me', { credentials: 'include' });
          if (r.ok) { const me = await r.json(); myUserId = me.id; }
      } catch {}

      if (myUserId) {
          try {
              const r = await fetch(`/api/subscriptions/${myUserId}/followings`, { credentials: 'include' });
              if (r.ok) {
                  const list = await r.json();
                  list.forEach(f => {
                      const id = f.followingUserId || f.targetUserId || f.userId || f.id;
                      if (id) myFollowings.add(String(id));
                  });
              }
          } catch {}
      }

      const container = document.getElementById('listWrap');

      try {
          const r = await fetch(`/api/subscriptions/${userId}/followings`, { credentials: 'include' });
          if (!r.ok) throw new Error();
          const list = await r.json();
          await renderList(list, container);
      } catch {
          container.innerHTML = `<div class="empty"><i class="fas fa-user-slash"></i><p>Не удалось загрузить</p></div>`;
      }

      async function renderList(list, container) {
          container.innerHTML = '';
          if (!list?.length) {
              container.innerHTML = `<div class="empty"><i class="fas fa-users"></i><p>Подписок пока нет</p></div>`;
              return;
          }
          for (const item of list) {
              const uid = item.followingUserId || item.targetUserId || item.userId;
              if (!uid) continue;
              const profile = await getProfile(uid);
              container.appendChild(buildRow(uid, profile));
          }
      }

      function buildRow(uid, profile) {
          const isMe      = String(uid) === String(myUserId);
          const following = myFollowings.has(String(uid));
          const avatarSrc = profile?.avatarUrl
              ? `/api/profiles/${profile.id}/avatar`
              : '/images/default-avatar.png';

          const row = document.createElement('div');
          row.className = 'user-row';
          row.innerHTML = `
              <img class="user-avatar" src="${avatarSrc}" alt=""
                   onerror="this.onerror=null;this.src='/images/default-avatar.png'">
              <div class="user-info">
                  <div class="user-name">${profile?.name || '?'} ${profile?.surname || ''}</div>
                  <div class="user-bio">${profile?.bioDescription || ''}</div>
              </div>
              ${!isMe ? `<button class="btn-sub ${following ? 'unfollow' : 'follow'}" data-uid="${uid}">
                  ${following ? 'Отписаться' : 'Подписаться'}
              </button>` : ''}
          `;

          row.addEventListener('click', e => {
              if (e.target.closest('.btn-sub')) return;
              window.location.href = `/profile/${uid}`;
          });

          const btn = row.querySelector('.btn-sub');
          if (btn) {
              btn.addEventListener('click', async e => {
                  e.stopPropagation();
                  const uid = btn.dataset.uid;
                  if (myFollowings.has(String(uid))) {
                      await fetch(`/api/subscriptions/${uid}/unsubscribe`,
                          { method: 'DELETE', credentials: 'include' });
                      myFollowings.delete(String(uid));
                      btn.textContent = 'Подписаться';
                      btn.className = 'btn-sub follow';
                      // если смотрим свои подписки — убираем строку
                      if (String(userId) === String(myUserId)) {
                          row.style.opacity = '0';
                          row.style.transform = 'translateX(20px)';
                          row.style.transition = 'all .3s ease';
                          setTimeout(() => row.remove(), 300);
                      }
                  } else {
                      await fetch(`/api/subscriptions/${uid}/subscribe`,
                          { method: 'POST', credentials: 'include' });
                      myFollowings.add(String(uid));
                      btn.textContent = 'Отписаться';
                      btn.className = 'btn-sub unfollow';
                  }
              });
          }
          return row;
      }

      async function getProfile(uid) {
          try {
              const r = await fetch(`/api/profiles/user/${uid}`, { credentials: 'include' });
              return r.ok ? await r.json() : null;
          } catch { return null; }
      }
  });
</script>
</body>
</html>
