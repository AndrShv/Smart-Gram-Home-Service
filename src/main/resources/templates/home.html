<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartGram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>

<div class="space-background">
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>
</div>
<div class="aurora">
    <div class="aurora-blob"></div>
    <div class="aurora-blob"></div>
    <div class="aurora-blob"></div>
</div>

<!-- TOP BAR -->
<header class="top-bar">
    <div class="top-bar-content">
        <a href="/home" class="logo">
            <div class="logo-mark">
                <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="lg1" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#c4b5fd"/>
                            <stop offset="50%" stop-color="#93c5fd"/>
                            <stop offset="100%" stop-color="#f9a8d4"/>
                        </linearGradient>
                        <linearGradient id="lg2" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#a78bfa"/>
                            <stop offset="100%" stop-color="#38bdf8"/>
                        </linearGradient>
                    </defs>
                    <circle cx="18" cy="18" r="16" stroke="url(#lg1)" stroke-width="1.5" stroke-dasharray="4 2"
                            fill="none" opacity=".5"/>
                    <circle cx="18" cy="18" r="11" fill="url(#lg2)" opacity=".15"/>
                    <path d="M13.5 14.5 C13.5 13.1 14.6 12 16 12 H19.5 C20.9 12 22 13.1 22 14.5 C22 15.9 20.9 17 19.5 17 H16.5 C15.1 17 14 18.1 14 19.5 C14 20.9 15.1 22 16.5 22 H20 C21.4 22 22.5 20.9 22.5 19.5"
                          stroke="url(#lg1)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                    <circle cx="28" cy="10" r="2.5" fill="#f9a8d4" opacity=".9"/>
                </svg>
            </div>
            <span class="logo-text">Smart<span>Gram</span></span>
        </a>
        <a href="/posts/create" class="create-post-btn">
            <i class="fas fa-plus"></i><span>Пост</span>
        </a>
        <button class="notif-btn" id="notificationsBtn">
            <i class="fas fa-bell"></i>
            <span class="notif-badge" id="notificationsBadge" style="display:none">0</span>
        </button>
    </div>
</header>

<!-- MAIN -->
<main class="main-content">

    <!-- STORIES -->
    <section class="stories-section">
        <div class="stories-label">Истории</div>
        <div class="stories-container" id="storiesContainer">
            <div class="story-item" id="addStoryBtn">
                <div class="story-avatar-wrap">
                    <div class="story-ring own">
                        <div class="story-ring-inner">
                            <div class="add-story-icon"><i class="fas fa-plus"></i></div>
                        </div>
                    </div>
                </div>
                <span class="story-username">Ваша</span>
            </div>
        </div>
    </section>

    <!-- FEED -->
    <div class="feed-header">
        <span class="feed-header-label">Лента</span>
        <div class="feed-header-line"></div>
    </div>

    <div class="posts-container" id="postsContainer">
        <div class="loading-posts">
            <div class="loader-dots">
                <div class="loader-dot"></div>
                <div class="loader-dot"></div>
                <div class="loader-dot"></div>
            </div>
            Загружаем посты…
        </div>
    </div>

</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <a href="/home"     class="nav-item active"><i class="fas fa-house"></i><span>Главная</span></a>
    <a href="/search"   class="nav-item"><i class="fas fa-magnifying-glass"></i><span>Поиск</span></a>
    <a href="/messages" class="nav-item"><i class="fas fa-comment-dots"></i><span>Чаты</span></a>
    <a href="/profile"  class="nav-item"><i class="fas fa-user"></i><span>Профиль</span></a>
    <a href="/settings" class="nav-item"><i class="fas fa-gear"></i><span>Настройки</span></a>
</nav>

<!-- STORY MODAL -->
<div class="modal" id="storyModal">
    <div class="story-viewer">
        <button class="close-story" id="closeStory"><i class="fas fa-xmark"></i></button>
        <div class="story-progress">
            <div class="progress-bar" id="storyProgress"></div>
        </div>
        <div class="story-header">
            <img class="story-avatar-img-modal" id="storyAvatarImg" alt="">
            <div>
                <div class="story-username-modal" id="storyUsernameModal"></div>
                <div class="story-time" id="storyTime"></div>
            </div>
        </div>
        <img class="story-image" id="storyImage" alt="">
        <div class="story-reactions">
            <button class="reaction-btn" data-reaction="LIKE"><i class="fas fa-heart"></i></button>
            <button class="reaction-btn" data-reaction="FIRE"><i class="fas fa-fire"></i></button>
            <button class="reaction-btn" data-reaction="WOW"><i class="fas fa-face-surprise"></i></button>
            <button class="reaction-btn" data-reaction="LAUGH"><i class="fas fa-face-laugh"></i></button>
        </div>
    </div>
</div>

<!-- REACTIONS PANEL -->
<div class="reactions-panel" id="reactionsPanel">
    <button class="reaction-option" data-reaction="LIKE"><i class="fas fa-heart"></i></button>
    <button class="reaction-option" data-reaction="FIRE"><i class="fas fa-fire"></i></button>
    <button class="reaction-option" data-reaction="WOW"><i class="fas fa-face-surprise"></i></button>
    <button class="reaction-option" data-reaction="LAUGH"><i class="fas fa-face-laugh"></i></button>
    <button class="reaction-option" data-reaction="SAD"><i class="fas fa-face-sad-tear"></i></button>
    <button class="reaction-option" data-reaction="ANGRY"><i class="fas fa-face-angry"></i></button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        console.log('🚀 SmartGram загружен');

        const storiesContainer = document.getElementById('storiesContainer');
        const postsContainer   = document.getElementById('postsContainer');
        const addStoryBtn      = document.getElementById('addStoryBtn');
        const storyModal       = document.getElementById('storyModal');
        const closeStoryBtn    = document.getElementById('closeStory');
        const reactionsPanel   = document.getElementById('reactionsPanel');

        let myUserId     = null;
        let followingIds = new Set();
        let storyTimer   = null;

        const likedPosts = new Set(JSON.parse(localStorage.getItem('likedPosts') || '[]'));
        function saveLikedPosts() { localStorage.setItem('likedPosts', JSON.stringify([...likedPosts])); }

        // ── NOTIFICATIONS BUTTON ──
        document.getElementById('notificationsBtn').addEventListener('click', () => {
            window.location.href = 'http://localhost:8084/notifications';
        });

        // ── INIT ──
        (async function init() {

            // 1. Получаем текущего пользователя
            try {
                const meRes = await fetch('/api/auth/me', { credentials: 'include' });
                if (meRes.ok) {
                    const me = await meRes.json();
                    myUserId = me.id || me.userId;
                    console.log('✅ myUserId:', myUserId);
                }
            } catch (e) { console.warn('❌ /api/auth/me error:', e); }

            // 2. Загружаем подписки СИНХРОННО — до рендера постов
            if (myUserId) {
                try {
                    const fRes = await fetch(`/api/subscriptions/${myUserId}/followings`, { credentials: 'include' });
                    if (fRes.ok) {
                        const list = await fRes.json();
                        list.forEach(f => {
                            const id = f.followingUserId || f.targetUserId || f.userId || f.id;
                            if (id) followingIds.add(String(id));
                        });
                        console.log('✅ followingIds загружены:', [...followingIds]);
                    }
                } catch (e) { console.warn('❌ followings error:', e); }
            } else {
                console.warn('⚠️ myUserId is null — подписки не загружены');
            }

            // 3. Загружаем кол-во непрочитанных уведомлений
            try {
                const cRes = await fetch('/api/notifications/my/unread/count', { credentials: 'include' });
                if (cRes.ok) {
                    const count = await cRes.json();
                    const badge = document.getElementById('notificationsBadge');
                    if (count > 0) {
                        badge.textContent = count > 99 ? '99+' : count;
                        badge.style.display = '';
                    } else {
                        badge.style.display = 'none';
                    }
                }
            } catch (e) { console.warn('❌ unread count error:', e); }

            // 4. Рендерим контент только после загрузки подписок
            loadStories();
            await loadPosts();

        })();

        // ── STORIES ──
        async function loadStories() {
            try {
                const res = await fetch('/api/stories', { credentials: 'include' });
                if (!res.ok) return;
                renderStories(await res.json());
            } catch (e) { console.error(e); }
        }

        function renderStories(stories) {
            const byUser = {};
            stories.forEach(s => { if (!byUser[s.userId]) byUser[s.userId] = []; byUser[s.userId].push(s); });

            const uids = Object.keys(byUser).filter(id => id !== String(myUserId));
            uids.sort((a, b) => {
                const af = followingIds.has(a), bf = followingIds.has(b);
                return af === bf ? 0 : af ? -1 : 1;
            });

            uids.forEach(async uid => {
                const profile = await getProfile(uid);
                storiesContainer.appendChild(createStoryElement(uid, profile, byUser[uid]));
            });
        }

        function createStoryElement(uid, profile, userStories) {
            const item = document.createElement('div');
            item.className = 'story-item';
            item.dataset.uid = uid;

            const isFollowing = followingIds.has(String(uid));
            const latestStory = userStories[0];
            const badgeHtml   = !isFollowing
                ? `<div class="story-follow-badge" data-uid="${uid}"><i class="fas fa-plus"></i></div>`
                : '';

            const avatarSrc = profile?.avatarUrl || '/images/default-avatar.png';
            const name      = profile?.name || '?';

            item.innerHTML = `
                <div class="story-avatar-wrap">
                    <div class="story-ring">
                        <div class="story-ring-inner">
                            <img class="story-avatar-img" src="${avatarSrc}" alt="${name}"
                                 onerror="this.src='/images/default-avatar.png'">
                        </div>
                    </div>
                    ${badgeHtml}
                </div>
                <span class="story-username">${name}</span>
            `;

            item.querySelector('.story-ring').addEventListener('click', e => {
                if (e.target.closest('.story-follow-badge')) return;
                openStory(latestStory, userStories, profile);
            });

            const badge = item.querySelector('.story-follow-badge');
            if (badge) {
                badge.addEventListener('click', async e => {
                    e.stopPropagation();
                    try {
                        const res = await fetch(`/api/subscriptions/${uid}/subscribe`,
                            { method: 'POST', credentials: 'include' });
                        if (res.ok || res.status === 409) {
                            followingIds.add(String(uid));
                            badge.remove();
                            document.querySelectorAll(`.follow-btn[data-uid="${uid}"]`)
                                .forEach(b => updateFollowBtnStyle(b, true));
                        }
                    } catch (err) { console.error(err); }
                });
            }
            return item;
        }

        // ── STORY VIEWER ──
        function openStory(story, allStories, profile) {
            document.getElementById('storyImage').src                 = story.photoUrl;
            document.getElementById('storyAvatarImg').src             = profile?.avatarUrl || '/images/default-avatar.png';
            document.getElementById('storyUsernameModal').textContent = profile?.name || '?';
            document.getElementById('storyTime').textContent          = formatTime(story.createdAt);

            const bar = document.getElementById('storyProgress');
            bar.style.width = '0%';
            storyModal.classList.add('show');
            markStoryViewed(story.id);

            if (storyTimer) clearInterval(storyTimer);
            let p = 0;
            storyTimer = setInterval(() => {
                p += 0.5; bar.style.width = p + '%';
                if (p >= 100) { clearInterval(storyTimer); closeStoryModal(); }
            }, 30);

            document.querySelectorAll('.reaction-btn').forEach(btn => {
                btn.onclick = () => reactToStory(story.id, btn.dataset.reaction);
            });
        }

        function closeStoryModal() {
            storyModal.classList.remove('show');
            if (storyTimer) { clearInterval(storyTimer); storyTimer = null; }
        }

        closeStoryBtn.addEventListener('click', closeStoryModal);
        storyModal.addEventListener('click', e => { if (e.target === storyModal) closeStoryModal(); });

        async function markStoryViewed(id) {
            try { await fetch(`/api/stories/${id}/view`, { method: 'POST', credentials: 'include' }); } catch {}
        }

        async function reactToStory(id, reaction) {
            try {
                await fetch(`/api/stories/${id}/reaction`, {
                    method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reaction })
                });
            } catch {}
        }

        // ── POSTS ──
        async function loadPosts() {
            try {
                const res = await fetch('/api/posts/feed', { credentials: 'include' });
                if (!res.ok) throw new Error();
                await renderPosts(await res.json());
            } catch {
                postsContainer.innerHTML = `<p style="text-align:center;color:var(--muted);padding:40px">Пока нет постов</p>`;
            }
        }

        async function renderPosts(posts) {
            postsContainer.innerHTML = '';
            if (!posts.length) {
                postsContainer.innerHTML = `<p style="text-align:center;color:var(--muted);padding:40px">Пока нет постов в ленте</p>`;
                return;
            }
            for (const post of posts) {
                const profile = await getProfile(post.userId);
                postsContainer.appendChild(await createPostElement(post, profile));
            }
        }

        async function createPostElement(post, profile) {
            const card = document.createElement('article');
            card.className = 'post-card';
            card.dataset.postId = post.id;

            const isOwn       = String(post.userId) === String(myUserId);
            const isFollowing = followingIds.has(String(post.userId));
            const reactions   = await getReactionsCount(post.id);
            const isLiked     = likedPosts.has(post.id);

            card.innerHTML = `
                <div class="post-header">
                    <div class="post-author" onclick="window.location.href='/profile/${post.userId}'">
                        <img class="post-avatar"
                             src="${profile?.avatarUrl || '/images/default-avatar.png'}"
                             alt="${profile?.name || '?'}"
                             onerror="this.src='/images/default-avatar.png'">
                        <div>
                            <div class="post-author-name">${profile?.name || '?'} ${profile?.surname || ''}</div>
                            <div class="post-time">${formatTime(post.createdAt)}</div>
                        </div>
                    </div>
                    ${!isOwn ? `<button class="follow-btn" data-uid="${post.userId}">...</button>` : ''}
                </div>
                <img class="post-image" src="${post.photoUrl}" alt=""
                     onerror="this.style.display='none'">
                <div class="post-content">
                    ${post.description ? `<p class="post-description">${post.description}</p>` : ''}
                    <div class="post-actions">
                        <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" data-post-id="${post.id}">
                            <i class="fas fa-heart"></i>
                            <span class="action-count">${reactions}</span>
                        </button>
                        <button class="action-btn comment-btn" data-post-id="${post.id}">
                             <i class="fas fa-comment"></i>
                              <span class="action-count">${post.commentsCount || 0}</span>
                        </button>
                        <button class="action-btn"><i class="fas fa-share-nodes"></i></button>
                        <button class="action-btn" style="margin-left:auto"><i class="fas fa-bookmark"></i></button>
                    </div>
                </div>
            `;

            // ── Follow — кнопка всегда рендерится для чужих постов,
            //             стиль определяется по актуальному followingIds ──
            const followBtn = card.querySelector('.follow-btn');
            if (followBtn) {
                const uid = followBtn.dataset.uid;

                // Применяем правильный стиль сразу
                updateFollowBtnStyle(followBtn, followingIds.has(String(uid)));

                followBtn.addEventListener('click', async () => {
                    const isNowFollowing = followingIds.has(String(uid));
                    try {
                        if (isNowFollowing) {
                            const res = await fetch(`/api/subscriptions/${uid}/unsubscribe`,
                                { method: 'DELETE', credentials: 'include' });
                            if (res.ok) {
                                followingIds.delete(String(uid));
                                document.querySelectorAll(`.follow-btn[data-uid="${uid}"]`)
                                    .forEach(b => updateFollowBtnStyle(b, false));
                                document.querySelectorAll(`.story-follow-badge[data-uid="${uid}"]`)
                                    .forEach(b => b.style.display = '');
                            }
                        } else {
                            const res = await fetch(`/api/subscriptions/${uid}/subscribe`,
                                { method: 'POST', credentials: 'include' });
                            if (res.ok || res.status === 409) {
                                followingIds.add(String(uid));
                                document.querySelectorAll(`.follow-btn[data-uid="${uid}"]`)
                                    .forEach(b => updateFollowBtnStyle(b, true));
                                document.querySelectorAll(`.story-follow-badge[data-uid="${uid}"]`)
                                    .forEach(b => b.style.display = 'none');
                            }
                        }
                    } catch (err) { console.error(err); }
                });
            }

            // ── Like ──
            const likeBtn = card.querySelector('.like-btn');
            let rt;
            likeBtn.addEventListener('mouseenter', () => {
                rt = setTimeout(() => showReactionsPanel(post.id, likeBtn), 500);
            });
            likeBtn.addEventListener('mouseleave', () => clearTimeout(rt));
            likeBtn.addEventListener('click', () => toggleReaction(post.id, 'LIKE', likeBtn));
            // COMMENT BUTTON
            const commentBtn = card.querySelector('.comment-btn');
            if (commentBtn) {
                commentBtn.addEventListener('click', () => {
                    openComments(post.id);
                });
            }

            return card;
        }

        // ── REACTIONS ──
        function showReactionsPanel(postId, button) {
            reactionsPanel.classList.add('show');
            const r = button.getBoundingClientRect();
            reactionsPanel.style.left = Math.max(10, r.left) + 'px';
            reactionsPanel.style.transform = 'none';
            reactionsPanel.querySelectorAll('.reaction-option').forEach(btn => {
                btn.onclick = () => { reactToPost(postId, btn.dataset.reaction); reactionsPanel.classList.remove('show'); };
            });
        }

        document.addEventListener('click', e => {
            if (!reactionsPanel.contains(e.target) && !e.target.closest('.like-btn'))
                reactionsPanel.classList.remove('show');
        });

        async function toggleReaction(postId, reaction, button) {
            const res = await fetch(`/api/posts/${postId}/reaction`, {
                method: 'POST', credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reaction })
            });
            if (res.ok) {
                const cnt = button.querySelector('.action-count');
                if (likedPosts.has(postId)) {
                    likedPosts.delete(postId); button.classList.remove('liked');
                    cnt.textContent = Math.max(0, parseInt(cnt.textContent) - 1);
                } else {
                    likedPosts.add(postId); button.classList.add('liked');
                    cnt.textContent = parseInt(cnt.textContent) + 1;
                }
                saveLikedPosts();
            }
        }

        async function reactToPost(postId, reaction) {
            const res = await fetch(`/api/posts/${postId}/reaction`, {
                method: 'POST', credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reaction })
            });
            if (res.ok && !likedPosts.has(postId)) {
                likedPosts.add(postId); saveLikedPosts();
                const lb = document.querySelector(`.like-btn[data-post-id="${postId}"]`);
                if (lb) {
                    lb.classList.add('liked');
                    lb.querySelector('.action-count').textContent =
                        parseInt(lb.querySelector('.action-count').textContent) + 1;
                }
            }
        }

        // ── HELPERS ──
        async function getProfile(uid) {
            try {
                const res = await fetch(`/api/profiles/user/${uid}`, { credentials: 'include' });
                return res.ok ? await res.json() : null;
            } catch { return null; }
        }

        async function getReactionsCount(postId) {
            try {
                const res = await fetch(`/api/posts/${postId}/reactions/count`, { credentials: 'include' });
                return res.ok ? await res.json() : 0;
            } catch { return 0; }
        }

        function formatTime(ts) {
            if (!ts) return '';
            const d = Math.floor((Date.now() - new Date(ts)) / 1000);
            if (d < 60)    return 'только что';
            if (d < 3600)  return Math.floor(d / 60) + ' мин';
            if (d < 86400) return Math.floor(d / 3600) + ' ч';
            return Math.floor(d / 86400) + ' д';
        }

        addStoryBtn.addEventListener('click', () => window.location.href = '/stories/create');

        console.log('✅ Инициализация завершена');
    });

    function updateFollowBtnStyle(btn, isFollowing) {
        if (isFollowing) {
            btn.textContent = 'Отписаться';
            btn.style.color = 'rgba(240,242,255,0.5)';
            btn.style.background = 'rgba(255,255,255,0.05)';
            btn.style.borderColor = 'rgba(255,255,255,0.1)';
        } else {
            btn.textContent = 'Подписаться';
            btn.style.color = 'var(--accent1)';
            btn.style.background = 'rgba(167,139,250,0.12)';
            btn.style.borderColor = 'rgba(255,255,255,0.18)';
        }
    }
    async function openComments(postId) {
        try {
            const res = await fetch(`http://localhost:8085/api/comments/post/${postId}`, {
                method: 'GET',
                credentials: 'include'
            });

            if (!res.ok) {
                console.warn('Не удалось загрузить комментарии', res.status);
                return;
            }

            const comments = await res.json();

            // рендерим комментарии в модалку
            showCommentsModal(comments, postId);

        } catch (err) {
            console.error('Ошибка fetch комментариев:', err);
        }
    }

    function showCommentsModal(comments, postId) {
        // пример простой модалки
        let modal = document.getElementById('commentsModal');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'commentsModal';
            modal.style.position = 'fixed';
            modal.style.top = '50%';
            modal.style.left = '50%';
            modal.style.transform = 'translate(-50%, -50%)';
            modal.style.background = 'white';
            modal.style.padding = '20px';
            modal.style.boxShadow = '0 2px 10px rgba(0,0,0,0.3)';
            modal.style.zIndex = 1000;
            document.body.appendChild(modal);
        }

        modal.innerHTML = `<h3>Комментарии (${postId})</h3>` +
            comments.map(c => `<p><b>${c.author}</b>: ${c.text}</p>`).join('') +
            `<button id="closeComments">Закрыть</button>`;

        document.getElementById('closeComments').onclick = () => modal.remove();
    }
</script>
</body>
</html>
