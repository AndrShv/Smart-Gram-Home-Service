<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поиск - SmartGram</title>
  <link rel="stylesheet" th:href="@{/css/search.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* Базовые стили - наследуем от home.css */
@import url('/css/home.css');

.main-content {
    padding: 80px 20px 100px;
}

/* Поисковая строка */
.search-container {
    margin-bottom: 30px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
}

.search-box {
    position: relative;
    background: rgba(15, 20, 35, 0.8);
    backdrop-filter: blur(15px);
    border-radius: 15px;
    border: 2px solid rgba(0, 212, 255, 0.3);
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.3s ease;
}

.search-box:focus-within {
    border-color: #00d4ff;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
}

.search-icon {
    color: rgba(0, 212, 255, 0.7);
    font-size: 18px;
}

.search-box input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: white;
    font-size: 16px;
}

.search-box input::placeholder {
    color: rgba(255, 255, 255, 0.4);
}

.clear-btn {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.5);
    cursor: pointer;
    padding: 5px;
    transition: color 0.3s ease;
}

.clear-btn:hover {
    color: #ff4757;
}

/* Табы */
.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    overflow-x: auto;
    scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
    display: none;
}

.tab {
    background: rgba(15, 20, 35, 0.6);
    border: 2px solid rgba(0, 212, 255, 0.2);
    border-radius: 12px;
    padding: 12px 24px;
    color: rgba(255, 255, 255, 0.7);
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
}

.tab:hover {
    border-color: rgba(0, 212, 255, 0.5);
    background: rgba(0, 212, 255, 0.1);
}

.tab.active {
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(123, 47, 247, 0.2));
    border-color: #00d4ff;
    color: #00d4ff;
}

/* Контент табов */
.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

/* Сетка пользователей */
.users-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
}

.user-card {
    background: rgba(15, 20, 35, 0.8);
    backdrop-filter: blur(15px);
    border-radius: 15px;
    border: 1px solid rgba(0, 212, 255, 0.2);
    padding: 20px;
    text-align: center;
    transition: all 0.3s ease;
    cursor: pointer;
}

.user-card:hover {
    border-color: #00d4ff;
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
}

.user-card img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 3px solid rgba(0, 212, 255, 0.3);
    margin-bottom: 15px;
}

.user-card h3 {
    color: white;
    font-size: 16px;
    margin-bottom: 5px;
}

.user-card p {
    color: rgba(255, 255, 255, 0.6);
    font-size: 13px;
    margin-bottom: 15px;
}

.user-card button {
    background: linear-gradient(135deg, #00d4ff, #7b2ff7);
    border: none;
    padding: 8px 20px;
    border-radius: 8px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

.user-card button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
}

/* Сетка постов */
.posts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 15px;
}

.post-item {
    position: relative;
    aspect-ratio: 1;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s ease;
}

.post-item:hover {
    transform: scale(1.05);
}

.post-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.post-item .overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    opacity: 0;
    transition: opacity 0.3s ease;
    color: white;
}

.post-item:hover .overlay {
    opacity: 1;
}

/* Пустое состояние */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: rgba(255, 255, 255, 0.5);
}

.empty-state i {
    font-size: 60px;
    margin-bottom: 20px;
    opacity: 0.5;
}

.empty-state p {
    font-size: 16px;
}

@media (max-width: 768px) {
    .users-grid {
        grid-template-columns: 1fr;
    }

    .posts-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
    }
}
  </style>
</head>
<body>
<!-- Космический фон -->
<div class="space-background">
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>
</div>

<!-- Верхняя панель -->
<header class="top-bar">
  <div class="top-bar-content">
    <div class="logo">
      <i class="fas fa-rocket"></i>
      <span>SmartGram</span>
    </div>
  </div>
</header>

<!-- Основной контент -->
<main class="main-content">
  <!-- Поисковая строка -->
  <div class="search-container">
    <div class="search-box">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="searchInput" placeholder="Поиск пользователей, постов, хэштегов..." autocomplete="off">
      <button class="clear-btn" id="clearBtn" style="display: none;">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>

  <!-- Табы -->
  <div class="tabs">
    <button class="tab active" data-tab="users">
      <i class="fas fa-users"></i> Пользователи
    </button>
    <button class="tab" data-tab="posts">
      <i class="fas fa-th"></i> Посты
    </button>
    <button class="tab" data-tab="hashtags">
      <i class="fas fa-hashtag"></i> Хэштеги
    </button>
  </div>

  <!-- Результаты поиска -->
  <div class="results-container">
    <!-- Вкладка пользователей -->
    <div class="tab-content active" id="users-tab">
      <div class="users-grid" id="usersGrid">
        <div class="empty-state">
          <i class="fas fa-user-astronaut"></i>
          <p>Начните поиск пользователей</p>
        </div>
      </div>
    </div>

    <!-- Вкладка постов -->
    <div class="tab-content" id="posts-tab">
      <div class="posts-grid" id="postsGrid">
        <div class="empty-state">
          <i class="fas fa-image"></i>
          <p>Начните поиск постов</p>
        </div>
      </div>
    </div>

    <!-- Вкладка хэштегов -->
    <div class="tab-content" id="hashtags-tab">
      <div class="hashtags-list" id="hashtagsList">
        <div class="empty-state">
          <i class="fas fa-hashtag"></i>
          <p>Начните поиск хэштегов</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Загрузка -->
  <div class="loading" id="loading" style="display: none;">
    <div class="spinner-orbit">
      <div class="spinner-planet"></div>
    </div>
    <p>Поиск...</p>
  </div>
</main>

<!-- Нижняя навигация -->
<nav class="bottom-nav">
  <a href="/home" class="nav-item">
    <i class="fas fa-home"></i>
    <span>Главная</span>
  </a>
  <a href="/search" class="nav-item active">
    <i class="fas fa-search"></i>
    <span>Поиск</span>
  </a>
  <a href="/messages" class="nav-item">
    <i class="fas fa-comment-dots"></i>
    <span>Сообщения</span>
  </a>
  <a href="/profile" class="nav-item">
    <i class="fas fa-user"></i>
    <span>Профиль</span>
  </a>
  <a href="/settings" class="nav-item">
    <i class="fas fa-cog"></i>
    <span>Настройки</span>
  </a>
</nav>

<script th:src="@{/js/search.js}"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const tabs = document.querySelectorAll('.tab');
    const usersGrid = document.getElementById('usersGrid');
    const postsGrid = document.getElementById('postsGrid');
    const loading = document.getElementById('loading');
    const token = localStorage.getItem('token');

    let searchTimeout;

    // Очистка поиска
    clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearBtn.style.display = 'none';
        usersGrid.innerHTML = '<div class="empty-state"><i class="fas fa-user-astronaut"></i><p>Начните поиск</p></div>';
    });

    searchInput.addEventListener('input', (e) => {
        const value = e.target.value;
        clearBtn.style.display = value ? 'block' : 'none';

        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            if (value.length >= 2) {
                performSearch(value);
            }
        }, 300);
    });

    // Переключение табов
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            const tabId = tab.dataset.tab + '-tab';
            document.getElementById(tabId).classList.add('active');
        });
    });

    async function performSearch(query) {
        loading.style.display = 'block';

        try {
            const response = await fetch(`/api/profiles/search?query=${encodeURIComponent(query)}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            const profiles = await response.json();
            renderUsers(profiles);
        } catch (error) {
            console.error('Ошибка поиска:', error);
        } finally {
            loading.style.display = 'none';
        }
    }

    function renderUsers(profiles) {
        if (profiles.length === 0) {
            usersGrid.innerHTML = '<div class="empty-state"><i class="fas fa-user-slash"></i><p>Ничего не найдено</p></div>';
            return;
        }

        usersGrid.innerHTML = profiles.map(profile => `
            <div class="user-card" onclick="window.location.href='/profile/${profile.userId}'">
                <img src="${profile.avatarUrl || '/images/default-avatar.png'}" alt="${profile.name}">
                <h3>${profile.name} ${profile.surname}</h3>
                <p>${profile.bioDescription || ''}</p>
                <button onclick="event.stopPropagation(); followUser('${profile.userId}')">
                    Подписаться
                </button>
            </div>
        `).join('');
    }

    window.followUser = function(userId) {
        console.log('Follow user:', userId);
    };
});
</script>
</body>
</html>
